[package]
name = "aimail"
version = "0.1.53"
edition = "2021"
license = "GPL-3.0-or-later"
description = "aimail CLI - set up, operate and maintain the AIMail link between your agent platform and the aimail-gateway."
repository = "https://github.com/metercai/aimail"
rust-version = "1.75"

# 形态：lib + bin 同包。
# - bin `aimail`（src/main.rs）= 单一命令行二进制，无 daemon；
# - lib `aimail`（src/lib.rs）= 同一份实现，供集成测试与后续用例直接调用
#   （基础设施层在命令移植完成前没有调用方，bin-only crate 会被
#   `clippy -D warnings` 判 dead_code —— lib 形态既解决该问题，也让
#   cli/tests 能直接对 config/home 做断言）。
# 版本：**rust 化后 CLI 是独立子项目，版本线独立**（owner 2026-10-04 裁决）——
# `cli/Cargo.toml` 即 CLI 版本身份的唯一真源；**不与** SDK/仓根 `pyproject.toml` 绑定、不要求同值。
# 发布打 tag 用 `cli-vX.Y.Z` 前缀，与 SDK 的 `vX.Y.Z` 两线分离。
# 门禁分层（owner 2026-10-11 裁决）："需要已装件"的用例（tests/repair_backfill_parity.rs，
# 经 python 门调**已装** aimailsdk）不进 dev 门禁 —— ci.yml 的干净 runner 上装不到 SDK，
# 该目标曾长期红。本 feature 由 L2 门禁（tests/cli/run-cli-gates.sh 步骤 2b）与 release
# 门禁显式开启；默认关闭时该测试文件编译为空。
[features]
default = []
sdk-parity = []

[[bin]]
name = "aimail"
path = "src/main.rs"

[dependencies]
clap = "4"
glob = "0.3"
hmac = "0.12"
md-5 = "0.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# serde derive：平台宿主表的类型化常量直接序列化成值视图（省掉手写 to_json）。
# preserve_order：JSON 对象保持**读写顺序**（indexmap），与 Python json.dump 的
# insertion-order 行为一致 ⇒ 更新一份凭据文件不会造成无谓的键序重排/文件抖动。
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
ureq = "2"
webpki-roots = "1.0.9"
yaml-rust2 = "0.10"
zip = { version = "4.2.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
