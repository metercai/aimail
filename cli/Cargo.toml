[package]
name = "aimail"
version = "0.1.58"
edition = "2021"
license = "GPL-3.0-or-later"
description = "aimail CLI - set up, operate and maintain the AIMail link between your agent platform and the aimail-gateway."
repository = "https://github.com/metercai/aimail"
rust-version = "1.75"

# Shape: lib + bin in one package.
# - bin `aimail` (src/main.rs) = a single command-line binary, no daemon;
# - lib `aimail` (src/lib.rs) = the same implementation, called directly by
#   integration tests and later use cases (the infrastructure layer has no
#   callers until the command ports are done, and a bin-only crate is judged
#   dead_code by `clippy -D warnings` -- the lib shape solves that and also
#   lets cli/tests assert on config/home directly).
# Version: **after the Rust port the CLI is an independent sub-project with an
# independent version line** (owner 2026-10-04 ruling) --
# `cli/Cargo.toml` is the single source (of truth) of the CLI version identity;
# **not** bound to the SDK/repo-root `pyproject.toml`, same value not required.
# Release tags use the `cli-vX.Y.Z` prefix, two separate lines from the SDK's `vX.Y.Z`.
# Gate layering (owner 2026-10-11 ruling): cases that "need installed parts"
# (tests/repair_backfill_parity.rs, which invokes the **installed** agent-aimail
# through the python gate) do not enter the dev gate -- a clean ci.yml runner
# cannot install the SDK, and that target was red for a long time. This feature
# is enabled explicitly by the L2 gate (tests/cli/run-cli-gates.sh step 2b) and
# the release gate; when off (the default) that test file compiles to empty.
[features]
default = []
sdk-parity = []

[[bin]]
name = "aimail"
path = "src/main.rs"

[dependencies]
clap = "4"
glob = "0.3"
hmac = "0.12"
md-5 = "0.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# serde derive: the typed constants of the platform host table serialize directly into value views (no hand-written to_json).
# preserve_order: JSON objects keep **read/write order** (indexmap), matching the
# insertion-order behavior of Python json.dump => updating a credentials file causes no needless key reordering/file churn.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = "0.8"
ureq = "2"
webpki-roots = "1.0.9"
yaml-rust2 = "0.10"
zip = { version = "4.2.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
