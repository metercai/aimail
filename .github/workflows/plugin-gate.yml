name: plugin-gate

# L2 pre-release gate for the PI-Desktop plugin artifact (.piplug).
# The artifact is what a user installs, so this judges the ARTIFACT: build → smoke → pack → re-read.
# Tag `plugin-v*` also attaches the packaged file to the GitHub release.

on:
  push:
    tags: ["plugin-v*"]
    paths:
      - "tssdk/packages/aimail-desktop-plugin/**"
      - "tssdk/packages/agent-aimail/src/desktop/**"
      - "tests/release/**"
  pull_request:
    paths:
      - "tssdk/packages/aimail-desktop-plugin/**"
      - "tssdk/packages/agent-aimail/src/desktop/**"
      - "tests/release/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tssdk/pnpm-lock.yaml

      - name: gate (install, types, surface tests, build, smoke, pack)
        run: bash tests/release/gate-pi-desktop-plugin.sh

      - name: diagnose a red gate (toolchain + type resolution)
        if: failure()
        run: |
          echo "node: $(node -v)  pnpm: $(pnpm -v)"
          echo "tsc: $(node tssdk/node_modules/typescript/bin/tsc --version)"
          cd tssdk
          pnpm list typescript @sinclair/typebox --depth 1 || true
          echo "--- declaration of the offending expression ---"
          node node_modules/typescript/bin/tsc --noEmit --pretty false             --strict packages/agent-aimail/src/core/tool-registry.ts 2>&1 | head -20 || true
          echo "--- does the package build alone? ---"
          node node_modules/typescript/bin/tsc -b packages/agent-aimail --force --verbose 2>&1 | tail -20 || true

      - name: show artifact
        run: ls -l dist-piplug && cat dist-piplug/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: piplug-${{ github.sha }}
          path: dist-piplug/*
          if-no-files-found: error

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "PI-Desktop plugin $tag (see dist-piplug/*.sha256)"
          gh release upload "$tag" dist-piplug/* --clobber
