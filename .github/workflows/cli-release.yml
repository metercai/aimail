name: cli-release

# CLI 发布分发（plan v3 S11，按桥 release.yml 落地）：
#   `cli-v*` tag 触发 → 3 平台 --release 构建 → 推 GitHub Release（aimail-<platform>）。
# 独立于 cli.yml（dev 门禁带 paths 过滤，tag 推送不能走它）。
# 纯 tag 触发、无 paths —— 与本仓 publish-pypi.yml / publish.yml / 桥 release.yml 同模式。
#
# 命名契约（bootstrap.sh 与 L3 都依赖）：资产名 = aimail-<platform>[.exe]，
#   platform ∈ linux-amd64 | linux-arm64 | macos-arm64 | windows-amd64。

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: cli

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
# ── Linux musl (zero deps, any kernel ≥ 2.6) ──
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-amd64
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux-arm64
            ext: ""
          # ── macOS (target macOS 11+) ──
          - target: aarch64-apple-darwin
            os: macos-14
            platform: macos-arm64
            ext: ""
          # ── Windows ──
          # CLI 未完成 Windows 移植（bridge/repair 深度依赖 unix 命令, 非 cfg 补丁能覆盖）;
          # 移植完成前从发版链移除 —— 先把 L3 走通, 恢复后取消注释即可。
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          #   platform: windows-amd64
          #   ext: ".exe"

    steps:
      - uses: actions/checkout@v5

      - name: Install deps (musl)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          # musl: setting RUSTFLAGS drops the target's implicit +crt-static, which would
          # yield a dynamically linked musl binary (needs the musl loader on the target).
          # Re-state it explicitly so linux-amd64/arm64 stay self-contained.
          # NB: keep a single contains() test — chaining `a || b && c || d` short-circuits on
          # the first truthy operand and yields the boolean `true` for the a-targets.
          RUSTFLAGS: ${{ contains(matrix.target, 'linux-musl') && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.os, 'macos') && '11.0' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/aimail${{ matrix.ext }}" "aimail-${{ matrix.platform }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: aimail-${{ matrix.platform }}
          path: cli/aimail-${{ matrix.platform }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v5
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: aimail-*/aimail-*
          body: |
            ## Platform variants

            | Suffix | Compatible with |
            |--------|-----------------|
            | `linux-amd64` | musl, **no runtime deps** |
            | `linux-arm64` | musl, **no runtime deps** |
            | `macos-arm64` | macOS 11+ (Apple Silicon) |
            | `windows-amd64` | Windows 10+ |

            Rust single binary, zero runtime deps. `aimail-<platform>` is
            fetched by `scripts/bootstrap.sh` (curl | bash) per platform.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
