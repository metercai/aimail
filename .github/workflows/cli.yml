name: cli

# Rust CLI (cli/) 的门禁 —— plan v3 S1。
#
# 只在 cli/ 或其本 workflow 变动时触发，避免与 pysdk/tssdk 的发布流互相带起。
#
# 三层：
#   1. gates          —— fmt（--check）· clippy（-D warnings）· cargo test ；
#   2. platform-check —— 平台专属 cfg 在**对应原生 runner** 上编译（与桥同款口径：
#                        在 ubuntu 上交叉 check windows 会在 C 构建阶段失败，
#                        那是工具链问题不是代码问题，不能当闸门）；
#   3. release-build  —— `--release` 产物（4 平台，命名与桥一致）。
#
# 与桥的差异（有意）：桥的 gates.yml 注释写明 clippy/fmt 曾是**既有欠账**故未纳入；
# 本 crate 是新建、零欠账，所以 fmt/clippy 从第一天起就是硬闸门。
#
# 发布/分发（artifact → GitHub Release）在 plan v3 S11 按桥的 release.yml 复用，
# 本 workflow 只负责"编译得过、测试得过、打得出版本产物"。

on:
  push:
    branches: [main, master]
    paths: ["cli/**", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["cli/**", ".github/workflows/cli.yml"]

defaults:
  run:
    working-directory: cli

jobs:
  gates:
    name: gates (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --all-targets

  platform-check:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 与桥同款 4 平台（macos-x86_64 已由桥实测不可用且不在发布集，故不列）
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-amd64
            ext: ""
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
            ext: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            ext: ""
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install deps (musl)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cargo build --release
        env:
          # musl: 显式 crt-static（否则得到动态链接的 musl 二进制，目标机缺 loader）
          RUSTFLAGS: ${{ contains(matrix.target, 'linux-musl') && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.os, 'macos') && '11.0' || '' }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/aimail${{ matrix.ext }}" "aimail-${{ matrix.platform }}${{ matrix.ext }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: aimail-${{ matrix.platform }}
          path: cli/aimail-${{ matrix.platform }}${{ matrix.ext }}
