name: l3

# ═══════════════════════════════════════════════════════════════════════
# L3 — post-release integration closed-loop regression (user environment / released artifacts)
#
# End-state first: use the **latest released** CLI + SDK + base gateway, in a **true user environment** (real OS
# hardware + real agent system + real LLM) to verify the "CLI×SDK×gateway" trio completes integration and runs the loop closed.
# Every artifact under test comes from a release channel (GitHub Release / PyPI / npm), never from the working tree.
#
# Relation to L2 (no duplication):
#   L2 journey = the **pre**-release gate, testing the **working-tree** rust binary, inside the advanced docker host;
#   L3      = the **post**-release smoke, testing the **released** build, on the GitHub runner's native OS/hardware.
#
# Triggers (owner 2026-10-11 cleanup Q1-B: a single trigger surface, no more workflow_run chain):
#   ① invoked by publish.yml (workflow_call, runs automatically after a successful release);
#   ② nightly (schedule) — catches "post-release drift";
#   ③ workflow_dispatch manually.
#   formerly triggered by workflow_run of the three release workflows — one release fanned out 7 L3 runs (mostly
#   skipped/cancelled), unreadable status, and it fired even on a failed release; now the caller controls it with needs/if.
#
# Matrix = 3 platforms × 3 agent cells = 9 jobs (regression content identical, see run-l3.sh):
#   platforms: linux-amd64 / linux-arm64 (native ARM) / macos-arm64
#   (Windows: the CLI port is incomplete; not run until the port lands; once restored = 4 platforms × 3 cells = 12 jobs)
#   agent cells: hermes (pysdk path) / dsh-aimail (CLI entry: aimail install --home ~/.dsh)
#             / dsh-plugin (plugin entry: dsh plugin --profile web add dsh-aimail).
#   dsh's two README-published paths (README lines 90/96, "pick one of the two") each take a cell,
#   with independent failure points: the aimail install path goes through CLI detect/platform adaptation; the plugin path goes straight to the dsh manager.
#
# Each job in three steps (D3 ruling):
#   ① install the target agent + configure the LLM (Xiaomi OpenAI-compatible endpoint, secret XIAOMI_API_KEY) + verify it runs
#   ② fetch the released CLI (bootstrap.sh online, the user's real entry) + the released gateway (Release binary)
#   ③ the same regression: aimail install (admin-key activation) → welcome loop → mail-query signature assertion
#
# Activation flow: only **admin-key** activation is tested (base gateway); activation codes (advanced) are not.
#   (the gateway releases in the aimail-gateway repo; cross-repo workflow_run is not possible; L3 takes its newest Release directly,
#    erroring loudly when it is missing, never guessing.)
# ═══════════════════════════════════════════════════════════════════════
on:
  workflow_call:          # invoked by publish.yml after a successful release
  schedule:
    - cron: "17 3 * * *"  # nightly — catches "post-release drift"
  workflow_dispatch: {}   # explicit empty object — a null value makes GitHub not register the trigger (dispatch API 422)

permissions:
  contents: read

# only one L3 at a time (matrix-internal parallelism, but runs serialized across runs): avoids double-burning LLM tokens / contending for runners.
concurrency:
  group: l3
  cancel-in-progress: false

env:
  LLM_BASE_URL: "https://api.xiaomimimo.com/v1"
  LLM_MODEL: "mimo-v2.6-flash"

jobs:
  l3:
    name: L3 ${{ matrix.platform }} / ${{ matrix.agent }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one red platform does not cancel the rest — verdicts from all 8 cells must be visible
      matrix:
        include:
          # ── Linux ──
          - { platform: linux-amd64, os: ubuntu-latest,   agent: hermes }
          - { platform: linux-amd64, os: ubuntu-latest,   agent: dsh-aimail }
          - { platform: linux-amd64, os: ubuntu-latest,   agent: dsh-plugin }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, agent: hermes }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, agent: dsh-aimail }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, agent: dsh-plugin }
          # ── macOS ──
          - { platform: macos-arm64, os: macos-14,        agent: hermes }
          - { platform: macos-arm64, os: macos-14,        agent: dsh-aimail }
          - { platform: macos-arm64, os: macos-14,        agent: dsh-plugin }
          # ── Windows ──
          # restore 3 cells = 12 jobs once the CLI Windows port completes (2026-10-17).
          - { platform: windows-amd64, os: windows-latest, agent: hermes }
          - { platform: windows-amd64, os: windows-latest, agent: dsh-aimail }
          - { platform: windows-amd64, os: windows-latest, agent: dsh-plugin }

    timeout-minutes: 45
    env:
      LLM_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
    steps:
      - name: Checkout aimail (scripts + L3 tests)
        uses: actions/checkout@v4
        with:
          path: aimail

      # L3's entire dependency on advanced = tests/agent-env/** (the single source of environment prep: prepare/verify +
      # llm-config.py, now self-contained in the aimail repo, pure stdlib) — no more cross-repo checkout: advanced is private,
      # and the triggering repo's GITHUB_TOKEN cannot access it (measured 404); also, L3's principle is that artifacts under test never come from the working tree.

      - name: L3 gate (agent env → published CLI+gateway → closed loop)
        shell: bash
        run: |
          # bash on windows-latest is git-bash; set PATH for the agent toolchains.
          export L3_PLATFORM="${{ matrix.platform }}"
          export L3_AGENT="${{ matrix.agent }}"
          export AIMAIL_REPO="$GITHUB_WORKSPACE/aimail"
          export LLM_API_KEY="${{ secrets.XIAOMI_API_KEY }}"
          # logs land in the workspace uniformly (valid in both contexts): env.HOME is the GitHub env context
          # (not the OS HOME; empty inside the expression ⇒ the path becomes /l3-logs, file not found ⇒ 0 artifacts).
          export L3_LOG_ARCHIVE="$GITHUB_WORKSPACE/l3-logs"
          mkdir -p "$L3_LOG_ARCHIVE"
          # capture all stdout (including child processes): when runner logs are unreadable this is the only evidence channel.
          bash "$AIMAIL_REPO/tests/l3/run-l3.sh" 2>&1 | tee "$L3_LOG_ARCHIVE/l3-stdout.log"
          rc="${PIPESTATUS[0]}"
          # self-check the on-disk log: it must exist, otherwise the upload step errors (instead of a silent 0 artifacts).
          echo "[l3] log archive: $L3_LOG_ARCHIVE"; ls -la "$L3_LOG_ARCHIVE" 2>&1
          exit "$rc"

      - name: Upload L3 artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-${{ matrix.platform }}-${{ matrix.agent }}-logs
          # absolute path: a relative path in this job does not resolve to $GITHUB_WORKSPACE/l3-logs
          # (checkout path:aimail shifts the effective working directory ⇒ 0 artifacts). github.workspace is unambiguous.
          path: ${{ github.workspace }}/l3-logs
          if-no-files-found: warn
