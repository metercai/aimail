name: l3

# ═══════════════════════════════════════════════════════════════════════
# L3 — post-release integration closed-loop regression (user environment / released artifacts)
#
# End-state first: use the **latest released** CLI + SDK + base gateway, in a **true user environment** (real OS
# hardware + real agent system + real LLM) to verify the "CLI×SDK×gateway" trio completes integration and runs the loop closed.
# Every artifact under test comes from a release channel (GitHub Release / PyPI / npm), never from the working tree.
#
# Relation to L2 (no duplication):
#   L2 journey = the **pre**-release gate, testing the **working-tree** rust binary, inside the advanced docker host;
#   L3      = the **post**-release smoke, testing the **released** build, on the GitHub runner's native OS/hardware.
#
# Triggers (owner 2026-10-11 cleanup Q1-B: a single trigger surface, no more workflow_run chain):
#   ① invoked by publish.yml (workflow_call, runs automatically after a successful release);
#   ② nightly (schedule) — catches "post-release drift";
#   ③ workflow_dispatch manually.
#   formerly triggered by workflow_run of the three release workflows — one release fanned out 7 L3 runs (mostly
#   skipped/cancelled), unreadable status, and it fired even on a failed release; now the caller controls it with needs/if.
#
# Matrix = 4 platforms x 1 agent cell (regression content identical, see run-l3.sh):
#   platforms: linux-amd64 / linux-arm64 (native ARM) / macos-arm64 / windows-amd64
#   agent cell: dsh (SSE V2, activation-code journey) — the ONLY cell on the tssdk path.
#     Owner ruling 2026-11-23: L3 = the published SDK, installed by the agent itself,
#     closed-loop, dsh only. Retired cells:
#       dsh-aimail   the CLI entry (`aimail install`) is no longer shipped
#       hermes       pysdk not migrated to SSE-V2 ⇒ SKIP_LEGACY in tests/l3/run-v2.sh,
#                    never counted green
#       pi / openclaw  L2 scope (this machine's OS+CPU), not an L3 cell
#     run-l3.sh refuses any other L3_AGENT, so a matrix edit cannot silently re-enable a
#     retired path.
#   dsh's V2 journey (run-l3.sh ④-⑤): applicant verifies email → applies an address
#   code → the real host agent is driven over its web API through LLM turns; the
#   plugin is installed by the (simulated) user via `dsh plugin add` + host restart
#   when the agent reports the tool missing (SKILL §1), never pre-installed.
#
# Each job in three steps (D3 ruling):
#   ① install the target agent + configure the LLM (Xiaomi OpenAI-compatible endpoint, secret XIAOMI_API_KEY) + verify it runs
#   ② fetch the published gateway (Release binary, sha256-pinned in tests/agent-env/pins.env)
#   ③ the same regression: activation code → prompt → plugin install → bind → welcome loop → identity card + signature

# Activation flow: only the V2 activation-code journey is tested (the dsh cell's own
# path through dsh-v2.sh). The retired admin-key CLI flow is not part of L3 any more.
# ═══════════════════════════════════════════════════════════════════════
on:
  workflow_call:          # invoked by publish.yml after a successful release
  schedule:
    - cron: "17 3 * * *"  # nightly — catches "post-release drift"
  workflow_dispatch:       # explicit object (a null value makes GitHub not register the trigger: dispatch API 422)
    inputs:
      cell:
        description: "只跑一格：<platform>/<agent>，如 linux-amd64/dsh；留空 = 全矩阵"
        required: false
        default: ""
      welcome_timeout:
        description: "welcome 回复等待秒数（留空 = 脚本默认：arm64 300 / 其他 120）"
        required: false
        default: ""

permissions:
  contents: read

# only one L3 at a time (matrix-internal parallelism, but runs serialized across runs): avoids double-burning LLM tokens / contending for runners.
concurrency:
  group: l3
  cancel-in-progress: false

env:
  LLM_BASE_URL: "https://api.xiaomimimo.com/v1"
  LLM_MODEL: "mimo-v2.6-flash"

jobs:
  l3:
    name: L3 ${{ matrix.platform }} / ${{ matrix.agent }}
    runs-on: ${{ matrix.os }}
    # NOTE: the dispatch-cell filter has to stay INSIDE the job (the `matrix`
    # context is not available in a job-level `if`, and using it there makes the
    # whole workflow undispatchable: 422). Cost, measured 2026-11-18: filtered
    # cells still take a runner slot, so a single-cell dispatch can queue behind
    # two macos cells. Acceptable; do not "optimise" this back into a job-level if.
    strategy:
      fail-fast: false   # one red platform does not cancel the rest — verdicts from all cells must be visible
      matrix:
        include:
          # dsh only (owner ruling 2026-11-23, tssdk path): 4 platforms x 1 cell = 4 cells.
          # Windows included: the V2 dsh path has no CLI dependency.
          - { platform: linux-amd64, os: ubuntu-latest,   agent: dsh }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, agent: dsh }
          - { platform: macos-arm64, os: macos-latest,        agent: dsh }
          - { platform: windows-amd64, os: windows-latest, agent: dsh }

    timeout-minutes: 45
    env:
      LLM_API_KEY: ${{ secrets.XIAOMI_API_KEY }}
      # 留空 => 脚本内 ${WELCOME_TIMEOUT:-120} 生效（arm64 分支另有 300）
      WELCOME_TIMEOUT: ${{ inputs.welcome_timeout }}
    steps:
      - name: Dispatch filter (only when workflow_dispatch passes a cell)
        id: filter
        shell: bash
        run: |
          CELL="${{ inputs.cell }}"
          if [ -z "$CELL" ] || [ "$CELL" = "${{ matrix.platform }}/${{ matrix.agent }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "cell=${{ matrix.platform }}/${{ matrix.agent }} will run (filter='${CELL}')"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipped by dispatch filter: filter='${CELL}', this cell=${{ matrix.platform }}/${{ matrix.agent }}"
          fi

      - name: Checkout aimail (scripts + L3 tests)
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          path: aimail

      # L3's entire dependency on advanced = tests/agent-env/** (the single source of environment prep: prepare/verify +
      # llm-config.py, now self-contained in the aimail repo, pure stdlib) — no more cross-repo checkout: advanced is private,
      # and the triggering repo's GITHUB_TOKEN cannot access it (measured 404); also, L3's principle is that artifacts under test never come from the working tree.

      - name: L3 gate (agent env → published gateway → dsh V2 closed loop)
        if: steps.filter.outputs.run == 'true'
        shell: bash
        run: |
          # bash on windows-latest is git-bash; set PATH for the agent toolchains.
          export L3_PLATFORM="${{ matrix.platform }}"
          export L3_AGENT="${{ matrix.agent }}"
          export AIMAIL_REPO="$GITHUB_WORKSPACE/aimail"
          export LLM_API_KEY="${{ secrets.XIAOMI_API_KEY }}"
          # logs land in the workspace uniformly (valid in both contexts): env.HOME is the GitHub env context
          # (not the OS HOME; empty inside the expression ⇒ the path becomes /l3-logs, file not found ⇒ 0 artifacts).
          export L3_LOG_ARCHIVE="$GITHUB_WORKSPACE/l3-logs"
          mkdir -p "$L3_LOG_ARCHIVE"
          # capture all stdout (including child processes): when runner logs are unreadable this is the only evidence channel.
          bash "$AIMAIL_REPO/tests/l3/run-l3.sh" 2>&1 | tee "$L3_LOG_ARCHIVE/l3-stdout.log"
          rc="${PIPESTATUS[0]}"
          # self-check the on-disk log: it must exist, otherwise the upload step errors (instead of a silent 0 artifacts).
          echo "[l3] log archive: $L3_LOG_ARCHIVE"; ls -la "$L3_LOG_ARCHIVE" 2>&1
          exit "$rc"

      - name: Upload L3 artifacts (logs)
        if: always() && steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: l3-${{ matrix.platform }}-${{ matrix.agent }}-logs
          # absolute path: a relative path in this job does not resolve to $GITHUB_WORKSPACE/l3-logs
          # (checkout path:aimail shifts the effective working directory ⇒ 0 artifacts). github.workspace is unambiguous.
          path: ${{ github.workspace }}/l3-logs
          if-no-files-found: warn
