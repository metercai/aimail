name: publish

# ═══════════════════════════════════════════════════════════════════════
# 发布单入口 — owner 2026-10-11 裁决 Q1-B(触发面单一 = dispatch)
#
# 为什么不再用 tag 触发(实测, 非偏好):
#   ① 本批 7 个 tag 首次 `git push --tags` 远端已存在但**一个 run 都没产生**(仓库总
#      run 数不变), 删+重推才触发 —— tag 事件不可靠, 且没有可重放的补发入口;
#   ② concurrency 组只容一个 pending: 连推多个 tag 时后到的 tag 会取消先到的
#      (本批 3 个 publish run cancelled);
#   ③ 被取消/中断的发布在 npm 服务端可能留下"已暂存未落地"的版本, 后续同版本重发
#      报 `E409 Cannot publish over previously staged version`。
#   ⇒ tag 改为**由本流程发布时创建**, 只作记录与 Release 名(不再作触发器)。
#
# 一次 dispatch 串起(用 needs, 不用 workflow_run):
#   gate(dev 门禁 = 复用 ci.yml) → cli-build(3 平台) → cli-release(建 tag + Release)
#                                 → npm(scripts/publish-npm.sh, 幂等) 
#                                 → pypi-build → pypi(内联; PyPI 侧必须绑定本文件名)
#                                 → l3(可复用 l3.yml, 装**已发布**件)
#   dry_run=true: 只构建/打包/校验 —— 不建 tag、不发 Release、不发布、不跑 L3。
#
# Trusted Publisher 绑定(外部契约, 云端一侧须与本文件一致):
#   · npm  (tssdk 5 包): repo metercai/aimail + workflow "publish.yml" + environment "npm-release"
#   · PyPI (aimailsdk) : repo metercai/aimail + workflow "publish.yml" + environment "pypi-release"
#   两侧同为 publish.yml 的原因(实测, 非偏好): GitHub 对 reusable workflow 一律以**顶层
#   调用方**签名 —— Sigstore 证书的 Build Config URI(oid 1.3.6.1.4.1.57264.1.18)记的是
#   publish.yml, 即便发布 job 当时跑在被调用的 publish-pypi.yml 里(2026-10-11 实测);
#   且 PyPI 官方明确 reusable workflow **不能**作为 Trusted Publisher 的 workflow
#   (warehouse#11096)。⇒ PyPI 发布 job 只能内联在本文件, 云端绑定也只能是 publish.yml。
#   改名须先更新 npmjs/pypi 侧绑定。
#   环境名无歧义(PyPI Integrity API 对 aimailsdk 0.1.48–0.1.50 记录的 publisher):
#     {"repository":"metercai/aimail","workflow":"publish-pypi.yml","environment":"pypi-release"}
#   ⇒ 本次只改 workflow 名(publish-pypi.yml → publish.yml), environment 保持 pypi-release。
#   重派后的验收手段: curl https://pypi.org/integrity/aimailsdk/<ver>/<wheel>/provenance
#   应显示 workflow=publish.yml + environment=pypi-release(比"job 绿"更硬的证据)。
# ═══════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = build/verify only (no tag, no Release, no publish, no L3)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release-type:
        description: 'Release type to enforce: rc (iteration) or stable (go-live). Empty = derive from package versions.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - rc
          - stable

# 顶层 permissions = 本流程**及其调用的 reusable workflow** 所需权限的并集:
#   被调用的 workflow(workflow_call = ci.yml / l3.yml)不能请求超过调用方顶层所允许的
#   权限 —— 2026-10-11 第一次 dry-run dispatch 就栽在这里:
#     "The nested job 'publish' is requesting 'actions: read, id-token: write',
#      but is only allowed 'actions: none, id-token: none'"。
#   所以这里的并集必须是 contents: write(建 tag/Release) + id-token: write(OIDC)
#   + actions: read(artifact 下载);各 job 再按需**收窄**(job 级只能缩小, 不能放大)。
permissions:
  contents: write
  id-token: write
  actions: read

# 一次只允许一个发布 run;发布不可中断(即便有新 pending, cancel-in-progress: false
# 也只影响 pending 之间, 不会砍正在跑的发布)。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    # 发布前跑同一套 dev 门禁 —— 门禁只在 ci.yml 一处定义(单真源)。
    # platforms: false ⇒ 平台编译由下面的 cli-build 负责, 不重复建 3 次。
    uses: ./.github/workflows/ci.yml
    with:
      platforms: false

  meta:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cli_version: ${{ steps.v.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve CLI version (cli/Cargo.toml = 唯一真源)
        id: v
        run: |
          cli=$(python3 -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('cli/Cargo.toml').read(), re.M).group(1))")
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          echo "CLI version: $cli"

  cli-build:
    needs: [gate, meta]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux musl (zero deps, any kernel ≥ 2.6) ──
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-amd64
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux-arm64
            ext: ""
          # ── macOS (target macOS 11+) ──
          - target: aarch64-apple-darwin
            os: macos-14
            platform: macos-arm64
            ext: ""
          # ── Windows ──
          # CLI Windows 移植完成(2026-10-17: W1 cfg 门 + W2 运行期 6 组 windows 分支);
          # bridge 不在 L3 闭环依赖面(L3 只装 CLI+SDK+网关), windows 格无 bridge 前置。
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v5

      - name: Install deps (musl)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: cli
        env:
          # musl: setting RUSTFLAGS drops the target's implicit +crt-static, which would
          # yield a dynamically linked musl binary (needs the musl loader on the target).
          # Re-state it explicitly so linux-amd64/arm64 stay self-contained.
          # NB: keep a single contains() test — chaining `a || b && c || d` short-circuits
          # on the first truthy operand and yields the boolean `true` for the a-targets.
          RUSTFLAGS: ${{ contains(matrix.target, 'linux-musl') && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.os, 'macos') && '11.0' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        working-directory: cli
        run: cp "target/${{ matrix.target }}/release/aimail${{ matrix.ext }}" "aimail-${{ matrix.platform }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: aimail-${{ matrix.platform }}
          path: cli/aimail-${{ matrix.platform }}${{ matrix.ext }}

  cli-release:
    needs: [meta, cli-build]
    if: ${{ inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建 tag + 发 GitHub Release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5

      - name: Create tag cli-v<version> if absent
        env:
          VER: ${{ needs.meta.outputs.cli_version }}
        run: |
          tag="cli-v$VER"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "$tag already on origin — nothing to create"
          else
            git tag "$tag" && git push origin "$tag"
            echo "created $tag"
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ needs.meta.outputs.cli_version }}
          files: aimail-*/aimail-*
          body: |
            ## Platform variants

            | Suffix | Compatible with |
            |--------|-----------------|
            | `linux-amd64` | musl, **no runtime deps** |
            | `linux-arm64` | musl, **no runtime deps** |
            | `macos-arm64` | macOS 11+ (Apple Silicon) |

            Rust single binary, zero runtime deps. `aimail-<platform>` is
            fetched by `scripts/bootstrap.sh` (curl | bash) per platform.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    needs: [gate, meta]
    runs-on: ubuntu-latest
    # TP binding pins this environment name; OIDC claims include it and npm
    # compares it exactly against the npmjs-side configuration.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: tssdk
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          # workspace root (with the lockfile) is tssdk/, not the repo root
          cache-dependency-path: tssdk/pnpm-lock.yaml

      - name: Ensure npm >= 11.5.2 (trusted publishing fixes)
        # PINNED to 11.12.1 (verified locally): 'npm@^11.5.2' floats and a
        # mid-Sept 11.x release crashed bundled packs with "Exit handler
        # never called!" (openclaw-aimail bundleDependencies publish, CI).
        run: npm install -g npm@11.12.1
        working-directory: .

      - name: Install (tssdk workspace)
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        # 单一入口: 根 package.json 的 build 脚本(审计: 三处手抄清单易漏包)
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish changed packages (TP/OIDC, dist-tag by release type)
        # 幂等/skip、"上架可查"判据、逐包失败汇总,全部在 scripts/publish-npm.sh 一处
        # (owner 裁决 2026-10-11: 原先这里的 while 循环重抄了一份 skip 逻辑 ⇒ 双真源,
        #  且 set -e 让首个失败即中断, 发布会静默少发几个包)。本 step 只给包目录清单。
        # Repo-level tooling lives in <repo>/scripts (NOT tssdk/scripts); this step runs
        # with working-directory: tssdk, so resolve it absolutely.
        env:
          # 审计 D8: dispatch 声明的 release-type 透传给 publish-npm.sh 做真校验
          REQUIRE_RELEASE_TYPE: ${{ inputs.release-type }}
          # dry_run ⇒ script 只 pack + L2 校验, 不真发(且跳过"上架可查"轮询)
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/publish-npm.sh" \
            packages/mail-core packages/mail packages/dsh-aimail packages/openclaw-aimail packages/pi-aimail

  # PyPI(pysdk)—— 内联, 不用 reusable workflow: PyPI 的 Trusted Publisher 不接受 reusable
  # workflow 作为绑定对象(warehouse#11096), 且证书里的 Build Config URI 记的是顶层调用方
  # ⇒ 发布 job 必须就在本文件里, 云端绑定 workflow 名 = publish.yml(见文件头契约)。
  pypi-build:
    needs: [gate, meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # 审计 D8: build job 只需读仓库(原为无显式声明=默认权限偏宽)
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check version consistency (pyproject vs aimail.__version__)
        id: check
        run: |
          py_ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init_ver=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('pysdk/__init__.py').read()).group(1))")
          echo "pyproject=$py_ver  __init__=$init_ver"
          [ "$py_ver" = "$init_ver" ] || { echo "VERSION MISMATCH — bump both before publishing"; exit 1; }
          echo "version=$py_ver" >> "$GITHUB_OUTPUT"

      - name: Release gate L0 (python) — pytest + pyflakes
        # shell: bash ⇒ GH 展开为 `bash -e -o pipefail`。默认 shell 无 pipefail，
        # 而下面 pytest 走 `| tail -2`：单测红灯会被 tail 的 0 退出码吞掉 →
        # 仍发 PyPI（审计 P0，2026-09-21 实测复现）。
        shell: bash
        run: |
          # 审计 D8: 门禁依赖钉版(与 npm 侧钉 npm@11.12.1 同理), 否则上游行为
          # 变化会静默改变门禁结论。
          # PyYAML: tests/sdk/test_hermes_toolset_ensure.py imports yaml at module level
          # (pyproject extra `hermes`; landed 2026-09-30, i.e. after v0.1.30, so the
          # first tag since then hit a clean-environment collection error).
          python3 -m pip install --quiet pytest==9.1.1 pyflakes==3.4.0 PyYAML==6.0.2
          python3 -m pytest tests/sdk/ -q | tail -40   # tail 宽度只影响可见性; rc 由 pipefail 保真(P0 审计不变)
          # pyflakes 仅查核心模块;hermes 辅助脚本(patch_*/register_profiles/
          # toolsets)有意 `import aimail`(side-effect sys.path 注入),只做语法检查。
          python3 -m pyflakes pysdk/aimail_base.py pysdk/aimail_board.py pysdk/aimail_tools.py \
            pysdk/aimail_mcp_server.py pysdk/hermes/aimail_hermes.py pysdk/deer-flow/*.py || exit 1
          for f in $(find pysdk -name '*.py' -not -path '*__pycache__*'); do
            python3 -m py_compile "$f" || exit 1
          done

      - name: Install build tooling
        run: python3 -m pip install build==1.5.0

      - name: Build wheel
        run: python3 -m build --wheel --outdir dist/ .

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimail-wheel
          path: dist/aimailsdk-*.whl

      - name: Release gate — tests/sdk/release/l2-verify-wheel.sh (clean-venv 3-layout smoke)
        run: bash tests/sdk/release/l2-verify-wheel.sh

  pypi:
    needs: [gate, meta, pypi-build]
    # dry_run ⇒ 只跑上面的构建 + L2 校验, 不上传(语义与原 reusable 调用的 publish 输入等价)。
    if: ${{ inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    # TP binding pins this environment name; OIDC claims include it and PyPI
    # compares it exactly against the publisher configuration.
    environment: pypi-release
    permissions:
      id-token: write   # OIDC: mint the PyPI exchange token, no secrets
      actions: read     # download-artifact@v4 reads the build job's artifact
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aimail-wheel
          path: dist/

      - name: Skip if version already on PyPI (re-dispatch of same commit)
        id: skip
        env:
          VER: ${{ needs.pypi-build.outputs.version }}
        run: |
          if curl -fsS "https://pypi.org/pypi/aimailsdk/$VER/json" >/dev/null 2>&1; then
            echo "aimail $VER already published — nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        # 真正的跳过：step 内 `exit 0` 只结束本 step，后续 step 照跑（PyPI 会 400）。
        if: steps.skip.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  l3:
    needs: [cli-release, npm, pypi]
    if: ${{ inputs.dry_run != 'true' }}
    uses: ./.github/workflows/l3.yml
    secrets: inherit
