name: publish

# ═══════════════════════════════════════════════════════════════════════
# single release entry point — owner ruling 2026-10-11 Q1-B (single trigger surface = dispatch)
#
# Why tag triggering was dropped (measured, not preference):
#   ① for this batch of 7 tags, the first `git push --tags` found them already on the remote but **produced zero runs** (the repo's total
#      run count was unchanged); only delete+re-push triggered — tag events are unreliable, and there is no replayable re-issue entry;
#   ② a concurrency group holds only one pending: pushing several tags in a row makes a later tag cancel the earlier
#      (3 publish runs cancelled in this batch);
#   ③ a cancelled/aborted release can leave a "staged but not landed" version on the npm server side; a later same-version re-publish
#      reports `E409 Cannot publish over previously staged version`.
#   ⇒ tags are now **created by this flow at publish time**, serving only as records and Release names (no longer triggers).
#
# One dispatch chains (using needs, not workflow_run):
#   gate (dev gate = reusing ci.yml) → cli-build (3 platforms) → cli-release (create tag + Release)
#                                 → npm (scripts/publish-npm.sh, idempotent) 
#                                 → pypi-build → pypi (inlined; the PyPI side must bind this file name)
#                                 → l3 (reuses l3.yml, installing **released** artifacts)
#   dry_run=true: build/package/verify only — no tag, no Release, no publish, no L3.
#
# Trusted Publisher bindings (external contract; the cloud side must match this file):
#   · npm  (the 5 tssdk packages): repo metercai/aimail + workflow "publish.yml" + environment "npm-release"
#   · PyPI (agent-aimail) : repo metercai/aimail + workflow "publish.yml" + environment "pypi-release"
#   Why both sides are publish.yml (measured, not preference): GitHub signs a reusable workflow with its **top-level
#   caller** — the Sigstore certificate's Build Config URI (oid 1.3.6.1.4.1.57264.1.18) records
#   publish.yml, even when the publish job ran inside the called publish-pypi.yml (measured 2026-10-11);
#   and PyPI explicitly states a reusable workflow **cannot** serve as a Trusted Publisher workflow
#   (warehouse#11096). ⇒ the PyPI publish job can only be inlined in this file, and the cloud binding can only be publish.yml.
#   A rename must first update the npmjs/pypi-side bindings.
#   Environment names are unambiguous (the publisher recorded by the PyPI Integrity API for aimailsdk 0.1.48–0.1.50):
#     {"repository":"metercai/aimail","workflow":"publish-pypi.yml","environment":"pypi-release"}
#   ⇒ this change only renames the workflow (publish-pypi.yml → publish.yml); the environment stays pypi-release.
#   Acceptance after re-dispatch: curl https://pypi.org/integrity/aimailsdk/<ver>/<wheel>/provenance
#   should show workflow=publish.yml + environment=pypi-release (harder evidence than "the job is green").
# ═══════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = build/verify only (no tag, no Release, no publish, no L3)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release-type:
        description: 'Release type to enforce: rc (iteration) or stable (go-live). Empty = derive from package versions.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - rc
          - stable

# Top-level permissions = the union of the permissions needed by this flow **and the reusable workflows it calls**:
#   a called workflow (workflow_call = ci.yml / l3.yml) cannot request permissions beyond what the caller's top level allows
#   — the first dry-run dispatch on 2026-10-11 fell over exactly here:
#     "The nested job 'publish' is requesting 'actions: read, id-token: write',
#      but is only allowed 'actions: none, id-token: none'"。
#   so the union here must be contents: write (create tag/Release) + id-token: write (OIDC)
#   + actions: read (artifact download); each job then **narrows** as needed (job level can only shrink, never expand).
permissions:
  contents: write
  id-token: write
  actions: read

# Only one release run at a time; a release is not interruptible (even with a new pending, cancel-in-progress: false
# affects only between pendings and never kills a release in flight).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    # Run the same dev gate before release — the gate is defined in ci.yml alone (single source).
    # platforms: false ⇒ platform compilation is the cli-build below's job; no 3× duplicate builds.
    uses: ./.github/workflows/ci.yml
    with:
      platforms: false

  meta:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cli_version: ${{ steps.v.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve CLI version (cli/Cargo.toml = the single source of truth)
        id: v
        run: |
          cli=$(python3 -c "import re; print(re.search(r'^version = \"([^\"]+)\"', open('cli/Cargo.toml').read(), re.M).group(1))")
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          echo "CLI version: $cli"

  cli-build:
    needs: [gate, meta]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux musl (zero deps, any kernel ≥ 2.6) ──
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux-amd64
            ext: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux-arm64
            ext: ""
          # ── macOS (target macOS 11+) ──
          - target: aarch64-apple-darwin
            os: macos-14
            platform: macos-arm64
            ext: ""
          # ── Windows ──
          # CLI Windows port complete (2026-10-17: W1 cfg gate + W2 six runtime windows branches);
          # the bridge is outside the L3 closed-loop dependency surface (L3 installs CLI+SDK+gateway only); the windows cell has no bridge precondition.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v5

      - name: Install deps (musl)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        working-directory: cli
        env:
          # musl: setting RUSTFLAGS drops the target's implicit +crt-static, which would
          # yield a dynamically linked musl binary (needs the musl loader on the target).
          # Re-state it explicitly so linux-amd64/arm64 stay self-contained.
          # NB: keep a single contains() test — chaining `a || b && c || d` short-circuits
          # on the first truthy operand and yields the boolean `true` for the a-targets.
          RUSTFLAGS: ${{ contains(matrix.target, 'linux-musl') && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.os, 'macos') && '11.0' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        working-directory: cli
        run: cp "target/${{ matrix.target }}/release/aimail${{ matrix.ext }}" "aimail-${{ needs.meta.outputs.cli_version }}-${{ matrix.platform }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: aimail-${{ matrix.platform }}
          path: cli/aimail-${{ needs.meta.outputs.cli_version }}-${{ matrix.platform }}${{ matrix.ext }}
          if-no-files-found: error

  cli-release:
    needs: [meta, cli-build]
    if: ${{ inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag + publish the GitHub Release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5

      # SDK-only releases (tssdk/pysdk) re-dispatch this workflow while the CLI
      # version is unchanged. The tag exists then, and creating/refreshing the
      # Release again would rewrite assets users already pinned by sha256 — so the
      # upload step only runs when this run actually created the tag.
      - name: Create tag cli-v<version> if absent
        id: tag
        env:
          VER: ${{ needs.meta.outputs.cli_version }}
        run: |
          tag="cli-v$VER"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "$tag already on origin — nothing to create"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$tag" && git push origin "$tag"
            echo "created $tag"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ needs.meta.outputs.cli_version }}
          files: aimail-*/aimail-*
          body: |
            ## Platform variants

            | Asset | Compatible with |
            |-------|-----------------|
            | `aimail-${{ needs.meta.outputs.cli_version }}-linux-amd64` | musl, **no runtime deps** |
            | `aimail-${{ needs.meta.outputs.cli_version }}-linux-arm64` | musl, **no runtime deps** |
            | `aimail-${{ needs.meta.outputs.cli_version }}-macos-arm64` | macOS 11+ (Apple Silicon) |
            | `aimail-${{ needs.meta.outputs.cli_version }}-windows-amd64.exe` | Windows 10+ (x86_64) |

            Rust single binary, zero runtime deps. Assets are versioned
            (`aimail-<version>-<platform>[.exe]`) and fetched by
            `scripts/bootstrap.sh` (curl | bash) per platform.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    # Order ruling (2026-10-19 verifier): CLI assets must land before the SDKs publish — agent-install.sh fetches
    # cli-v* release assets; 0.1.55 has no `agent` subcommand, so publishing the SDKs first opens an "installable but unusable" window.
    # under dry_run, cli-release is skipped by design; this step passes explicitly (pack/verify only, no publish).
    needs: [gate, meta, cli-release]
    if: ${{ always() && needs.gate.result == 'success' && needs.meta.result == 'success' && (needs.cli-release.result == 'success' || inputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    # TP binding pins this environment name; OIDC claims include it and npm
    # compares it exactly against the npmjs-side configuration.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: tssdk
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          # workspace root (with the lockfile) is tssdk/, not the repo root
          cache-dependency-path: tssdk/pnpm-lock.yaml

      - name: Ensure npm >= 11.5.2 (trusted publishing fixes)
        # PINNED to 11.12.1 (verified locally): 'npm@^11.5.2' floats and a
        # mid-Sept 11.x release crashed bundled packs with "Exit handler
        # never called!" (openclaw-aimail bundleDependencies publish, CI).
        run: npm install -g npm@11.12.1
        working-directory: .

      - name: Install (tssdk workspace)
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        # Single entry: the root package.json build script (audit: three hand-copied lists tend to miss a package)
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish changed packages (TP/OIDC, dist-tag by release type)
        # Idempotency/skip, the "visible on the registry" criterion, and the per-package failure summary all live in scripts/publish-npm.sh alone
        # (owner ruling 2026-10-11: the former while loop here re-copied the skip logic ⇒ a dual source,
        #  and set -e aborted on the first failure, so the release silently skipped a few packages). This step only hands over the package list.
        # Repo-level tooling lives in <repo>/scripts (NOT tssdk/scripts); this step runs
        # with working-directory: tssdk, so resolve it absolutely.
        env:
          # Audit D8: the dispatch-declared release-type is passed through to publish-npm.sh for a real check
          REQUIRE_RELEASE_TYPE: ${{ inputs.release-type }}
          # dry_run ⇒ the script only packs + L2-verifies, no real publish (and skips the "visible on the registry" poll)
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/publish-npm.sh" \
            packages/agent-aimail

  # PyPI (pysdk) — inlined, not a reusable workflow: PyPI's Trusted Publisher does not accept reusable
  # accept a reusable workflow as the binding object (warehouse#11096), and the Build Config URI in the certificate records the top-level caller
  # ⇒ the publish job must be in this file; the cloud-bound workflow name = publish.yml (see the file-header contract).
  pypi-build:
    needs: [gate, meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read   # audit D8: the build job only needs to read the repo (previously an undeclared default = overly broad permissions)
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check version consistency (pyproject vs aimail.__version__)
        id: check
        run: |
          py_ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init_ver=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('pysdk/__init__.py').read()).group(1))")
          echo "pyproject=$py_ver  __init__=$init_ver"
          [ "$py_ver" = "$init_ver" ] || { echo "VERSION MISMATCH — bump both before publishing"; exit 1; }
          echo "version=$py_ver" >> "$GITHUB_OUTPUT"

      - name: Release gate L0 (python) — pytest + pyflakes
        # shell: bash ⇒ GH expands this to `bash -e -o pipefail`. The default shell has no pipefail,
        # and the pytest below goes through `| tail -2`: a red unit test would be swallowed by tail's exit code 0 →
        # PyPI still gets published (audit P0, reproduced 2026-09-21).
        shell: bash
        run: |
          # Audit D8: gate deps pinned (same rationale as pinning npm@11.12.1 on the npm side); otherwise upstream
          # behavior changes would silently change the gate's verdict.
          # PyYAML: tests/sdk/test_hermes_toolset_ensure.py imports yaml at module level
          # (pyproject extra `hermes`; landed 2026-09-30, i.e. after v0.1.30, so the
          # first tag since then hit a clean-environment collection error).
          python3 -m pip install --quiet pytest==9.1.1 pyflakes==3.4.0 PyYAML==6.0.2
          python3 -m pytest tests/sdk/ -q | tail -40   # the tail width only affects visibility; the rc stays faithful via pipefail (audit P0 unchanged)
          # pyflakes checks only the core modules; the hermes helper scripts (patch_*/register_profiles/
          # toolsets) deliberately `import aimail` (side-effect sys.path injection) and get a syntax check only.
          python3 -m pyflakes pysdk/aimail_base.py pysdk/aimail_board.py pysdk/aimail_tools.py \
            pysdk/aimail_mcp_server.py pysdk/hermes/aimail_hermes.py pysdk/deer-flow/*.py || exit 1
          for f in $(find pysdk -name '*.py' -not -path '*__pycache__*'); do
            python3 -m py_compile "$f" || exit 1
          done

      - name: Install build tooling
        run: python3 -m pip install build==1.5.0

      - name: Build wheel
        run: python3 -m build --wheel --outdir dist/ .

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimail-wheel
          path: dist/agent_aimail-*.whl   # PEP 427: wheel file names use the normalized name (agent-aimail → agent_aimail)

      - name: Release gate — tests/sdk/release/l2-verify-wheel.sh (clean-venv 3-layout smoke)
        run: bash tests/sdk/release/l2-verify-wheel.sh

  pypi:
    # Order ruling (2026-10-19 verifier): same as npm — the SDKs may reach the registry only after a successful CLI publish;
    # any upstream failure/cancellation stops the PyPI publish (better to stop the whole batch than leave a half-published state).
    needs: [gate, meta, pypi-build, cli-release]
    # dry_run ⇒ run only the builds + L2 checks above, no upload (semantics equivalent to the publish input of the former reusable call).
    if: ${{ always() && inputs.dry_run != 'true' && needs.gate.result == 'success' && needs.meta.result == 'success' && needs.pypi-build.result == 'success' && needs.cli-release.result == 'success' }}
    runs-on: ubuntu-latest
    # TP binding pins this environment name; OIDC claims include it and PyPI
    # compares it exactly against the publisher configuration.
    environment: pypi-release
    permissions:
      id-token: write   # OIDC: mint the PyPI exchange token, no secrets
      actions: read     # download-artifact@v4 reads the build job's artifact
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aimail-wheel
          path: dist/

      - name: Skip if version already on PyPI (re-dispatch of same commit)
        id: skip
        env:
          VER: ${{ needs.pypi-build.outputs.version }}
        run: |
          if curl -fsS "https://pypi.org/pypi/agent-aimail/$VER/json" >/dev/null 2>&1; then
            echo "aimail $VER already published — nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        # A true skip: `exit 0` inside the step ends only that step; the following steps still run (PyPI would 400).
        if: steps.skip.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  l3:
    needs: [cli-release, npm, pypi]
    if: ${{ inputs.dry_run != 'true' }}
    uses: ./.github/workflows/l3.yml
    secrets: inherit
