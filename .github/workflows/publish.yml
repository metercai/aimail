# Publish the tssdk/ npm packages (aimail TS SDK) via Trusted Publishing.
#
# Trigger: manual (workflow_dispatch) — publish the current commit's versions.
# Auth: npmjs Trusted Publisher bound to THIS repo (metercai/aimail) +
# workflow "publish.yml" + environment "npm-release"; no personal token
# required. Each package's publishConfig.provenance: true enables provenance.
#
# Prerequisites (one-time, npmjs.com → each package → Settings → Publish):
#   1. enable Trusted Publishers, add repo metercai/aimail, workflow
#      "publish.yml", environment "npm-release" (must EXACTLY match the
#      job's environment).
#      Packages: @aimail/mail-core, @aimail/mail, dsh-aimail,
#      openclaw-aimail, pi-aimail.
#   2. Package manifests' repository.url must point at metercai/aimail
#      (npm OIDC exchange requirement; npm/cli#8730).
#
# The TS SDK lives in tssdk/ (subtree of the former aimail-sdk-ts repo);
# all build/publish steps run with tssdk/ as the working directory (it is
# its own pnpm workspace).
#
# Note: pnpm isolated linker rejects bundleDependencies at pack time, so
# packages with bundled deps (openclaw-aimail, pi-aimail) publish via
# scripts/publish-npm.sh (npm pack with symlink dereference + explicit
# workspace:^ rewrite), which supports CI provenance.
name: publish.yml

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type to enforce: rc (dev iteration, X.Y.Z-rc.N) or stable (go-live, X.Y.Z). Empty = derive from package versions.'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - rc
          - stable
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # TP binding pins this environment name; OIDC claims include it and npm
    # compares it exactly against the npmjs-side configuration.
    environment: npm-release
    permissions:
      # OIDC 令牌所需权限
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          # workspace root (with the lockfile) is tssdk/, not the repo root
          cache-dependency-path: tssdk/pnpm-lock.yaml

      - name: Ensure npm >= 11.5.2 (trusted publishing fixes)
        # PINNED to 11.12.1 (verified locally): 'npm@^11.5.2' floats and a
        # mid-Sept 11.x release crashed bundled packs with "Exit handler
        # never called!" (openclaw-aimail bundleDependencies publish, CI).
        # 11.12.1 packs the same tree cleanly (local repro of both 11.5.2
        # and 11.12.1 succeeded).
        run: npm install -g npm@11.12.1

      - name: Install (tssdk workspace)
        working-directory: tssdk
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        working-directory: tssdk
        run: |
          pnpm exec tsc -b packages/mail-core
          pnpm exec tsc -b packages/mail
          pnpm exec tsc -b packages/dsh-aimail
          pnpm exec tsc -p packages/openclaw-aimail/tsconfig.json
          pnpm exec tsc -p packages/pi-aimail/tsconfig.json

      - name: Test
        working-directory: tssdk
        run: pnpm test

      - name: Publish changed packages (TP/OIDC, dist-tag by release type)
        working-directory: tssdk
        env:
          PKGS: |
            @aimail/mail-core packages/mail-core
            @aimail/mail packages/mail
            dsh-aimail packages/dsh-aimail
            openclaw-aimail packages/openclaw-aimail
            pi-aimail packages/pi-aimail
        run: |
          # Version semantics (v0.1.7+): single product line X.Y.Z shared by
          # tag/PyPI/TS. Release type derived from package versions:
          #   X.Y.Z      -> stable -> dist-tag latest (bare-name host
          #                          installs resolve: dsh/openclaw/pi)
          #   X.Y.Z-rc.N -> rc     -> dist-tag rc (dev iteration; latest
          #                          stays on the last stable)
          # publish-npm.sh tags each publish accordingly.
          #
          # Enforce the workflow_dispatch release-type input when provided:
          # it must match the version-derived type of every package.
          want="${release-type:-}"
          if [ -n "$want" ]; then
            echo "dispatch release-type: $want"
            for name dir in $(echo "$PKGS"); do
              [ -z "$name" ] && continue
              ver=$(node -p "require('./$dir/package.json').version")
              kind=stable; [[ "$ver" == *-rc.* ]] && kind=rc
              if [ "$kind" != "$want" ]; then
                echo "::error::release-type mismatch: $name@$ver is $kind but dispatch asked for $want"
                exit 1
              fi
            done
            echo "release-type $want matches all package versions"
          else
            echo "release-type: (auto) derived per package version"
          fi
          # Skip packages whose current version is already on the registry
          # (re-dispatch of the same commit). npm publish of an existing
          # version is always E403/E404 regardless of auth method.
          echo "$PKGS" | while read -r name dir; do
            [ -z "$name" ] && continue
            ver=$(node -p "require('./$dir/package.json').version")
            published=$(npm view "$name@$ver" version 2>/dev/null || true)
            if [ -n "$published" ]; then
              echo "skip $name@$ver (already published)"
              continue
            fi
            echo "publishing $name@$ver (dist-tag by release type inside publish-npm.sh)"
            # Every package goes through publish-npm.sh: it rewrites
            # workspace:^ deps to concrete registry ranges (a direct npm
            # publish would ship the literal 'workspace:^' — npm cannot
            # install that), dereferences bundled symlinks, packs, and
            # publishes with provenance under CI.
            bash scripts/publish-npm.sh "$dir"
          done
