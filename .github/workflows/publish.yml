# Publish all packages to npmjs via Trusted Publishing (OIDC).
#
# Trigger: manual (workflow_dispatch) — publish the current commit's versions.
# Auth: npmjs Trusted Publisher bound to this repo+workflow+environment; no
# personal token required. Each package's publishConfig.provenance: true
# enables provenance.
#
# Prerequisites:
#   1. npmjs.com → each package → Settings → Publish: enable "Trusted
#      Publishers", add repo metercai/aimail-sdk-ts, workflow "publish.yml",
#      environment "npm-release" (must EXACTLY match the job's environment).
#      (One-time per package: @aimail/mail-core, @aimail/mail, dsh-aimail,
#      openclaw-aimail, pi-aimail.)
#   2. Package manifests' repository.url must exactly match this repo
#      (npm OIDC exchange requirement; npm/cli#8730).
#
# Note: pnpm isolated linker rejects bundleDependencies at pack time, so
# packages with bundled deps (openclaw-aimail, pi-aimail) publish via
# scripts/publish-npm.sh (npm pack with symlink dereference + explicit
# workspace:^ rewrite), which supports CI provenance.
#
# Environment binding note: the GitHub environment name is part of the OIDC
# claims npm validates. Pinning it (instead of leaving it unset on the npmjs
# side) avoids the empty-vs-null environment mismatch that surfaces as a
# misleading 404 on PUT.
name: publish.yml

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # TP binding pins this environment name; OIDC claims include it and npm
    # compares it exactly against the npmjs-side configuration.
    environment: npm-release
    permissions:
      # OIDC 令牌所需权限
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Ensure npm >= 11.5.2 (trusted publishing fixes)
        run: npm install -g npm@^11.5.2

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: |
          pnpm exec tsc -b packages/mail-core
          pnpm exec tsc -b packages/mail
          pnpm exec tsc -b packages/agentmail
          pnpm exec tsc -p packages/openclaw-aimail/tsconfig.json
          pnpm exec tsc -p packages/pi-aimail/tsconfig.json

      - name: Test
        run: pnpm test

      - name: Publish @aimail/mail-core (rc tag)
        run: npm publish --tag rc --access public --provenance
        working-directory: packages/mail-core

      - name: Publish @aimail/mail (rc tag)
        run: npm publish --tag rc --access public --provenance
        working-directory: packages/mail

      - name: Publish dsh-aimail (rc tag)
        run: npm publish --tag rc --access public --provenance
        working-directory: packages/agentmail

      - name: Publish openclaw-aimail (rc tag, bundled deps)
        run: |
          # publish-npm.sh rewrites workspace:^ deps and dereferences the
          # bundled @aimail/* symlinks (pnpm isolated linker cannot pack
          # bundleDependencies); publishes with provenance under CI.
          bash scripts/publish-npm.sh packages/openclaw-aimail

      - name: Publish pi-aimail (rc tag, bundled deps)
        run: |
          bash scripts/publish-npm.sh packages/pi-aimail
