# Publish all packages to npmjs via Trusted Publishing (OIDC).
#
# Trigger: manual (workflow_dispatch) — publish the current commit's versions.
# Auth: npmjs Trusted Publisher bound to this repo+workflow; no personal token
# required. Each package's publishConfig.provenance: true enables provenance.
#
# Prerequisite (one-time, npmjs web):
#   npmjs.com → package → Settings → Publish: enable "Trusted Publishers",
#   add this repo (metercai/dsh-aimail) + workflow name "publish.yml".
#   Repeat for @aimail/mail-core, @aimail/mail, dsh-aimail, openclaw-aimail.
name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # 关键：授予 OIDC 令牌所需的权限
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: |
          pnpm exec tsc -b packages/mail-core
          pnpm exec tsc -b packages/mail
          pnpm exec tsc -b packages/agentmail

      - name: Test
        run: pnpm test

      - name: Inspect OIDC subject (debug)
        run: |
          echo "REQ_URL=$ACTIONS_ID_TOKEN_REQUEST_URL"
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sigstore" > /tmp/oidc.json
          python3 -c "import json,base64; d=json.load(open('/tmp/oidc.json')); p=d['value'].split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print('subject:', c.get('sub')); print('workflow:', c.get('workflow')); print('environment:', c.get('environment')); print('ref:', c.get('ref'))"

      - name: Publish @aimail/mail-core (rc tag)
        run: npm publish --tag rc --access public --provenance
        working-directory: packages/mail-core

      - name: Publish @aimail/mail (rc tag)
        run: npm publish --tag rc --access public --provenance
        working-directory: packages/mail

      - name: Publish dsh-aimail (rc tag)
        run: npm publish --tag rc --access public --provenance
        working-directory: packages/agentmail

      - name: Publish openclaw-aimail (rc tag)
        run: npm publish --tag rc --access public --provenance
        working-directory: packages/openclaw-aimail
