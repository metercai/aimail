# Publish all packages to npmjs via Trusted Publishing (OIDC).
#
# Trigger: manual (workflow_dispatch) — publish the current commit's versions.
# Auth: npmjs Trusted Publisher bound to this repo+workflow+environment; no
# personal token required. Each package's publishConfig.provenance: true
# enables provenance.
#
# Prerequisites:
#   1. npmjs.com → each package → Settings → Publish: enable "Trusted
#      Publishers", add repo metercai/aimail-sdk-ts, workflow "publish.yml",
#      environment "npm-release" (must EXACTLY match the job's environment).
#      (One-time per package: @aimail/mail-core, @aimail/mail, dsh-aimail,
#      openclaw-aimail, pi-aimail.)
#   2. Package manifests' repository.url must exactly match this repo
#      (npm OIDC exchange requirement; npm/cli#8730).
#
# Note: pnpm isolated linker rejects bundleDependencies at pack time, so
# packages with bundled deps (openclaw-aimail, pi-aimail) publish via
# scripts/publish-npm.sh (npm pack with symlink dereference + explicit
# workspace:^ rewrite), which supports CI provenance.
#
# Environment binding note: the GitHub environment name is part of the OIDC
# claims npm validates. Pinning it (instead of leaving it unset on the npmjs
# side) avoids the empty-vs-null environment mismatch that surfaces as a
# misleading 404 on PUT.
name: publish.yml

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # TP binding pins this environment name; OIDC claims include it and npm
    # compares it exactly against the npmjs-side configuration.
    environment: npm-release
    permissions:
      # OIDC 令牌所需权限
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Ensure npm >= 11.5.2 (trusted publishing fixes)
        run: npm install -g npm@^11.5.2

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: |
          pnpm exec tsc -b packages/mail-core
          pnpm exec tsc -b packages/mail
          pnpm exec tsc -b packages/dsh-aimail
          pnpm exec tsc -p packages/openclaw-aimail/tsconfig.json
          pnpm exec tsc -p packages/pi-aimail/tsconfig.json

      - name: Test
        run: pnpm test

      - name: Publish changed packages (TP/OIDC, latest tag, skip already-published)
        env:
          PKGS: |
            @aimail/mail-core packages/mail-core
            @aimail/mail packages/mail
            dsh-aimail packages/dsh-aimail
            openclaw-aimail packages/openclaw-aimail
            pi-aimail packages/pi-aimail
        run: |
          # Skip packages whose current version is already on the registry
          # (re-dispatch of the same commit). npm publish of an existing
          # version is always E403/E404 regardless of auth method.
          #
          # Prerelease publishes must carry an explicit --tag (npm >= 11.5
          # refuses implicit-latest for prerelease versions). We tag `rc`
          # and then move `latest` onto the new version with `npm dist-tag
          # add`, so plain `npm install <pkg>` still resolves to it.
          echo "$PKGS" | while read -r name dir; do
            [ -z "$name" ] && continue
            ver=$(node -p "require('./$dir/package.json').version")
            published=$(npm view "$name@$ver" version 2>/dev/null || true)
            if [ -n "$published" ]; then
              echo "skip $name@$ver (already published)"
              continue
            fi
            echo "publishing $name@$ver"
            # npm >= 11.5 refuses implicit-latest prerelease publishes, so
            # publish under the `rc` tag, then move `latest` onto the new
            # version explicitly (idempotent, works for bare & scoped names).
            if [ "$name" = "openclaw-aimail" ] || [ "$name" = "pi-aimail" ]; then
              bash scripts/publish-npm.sh "$dir"
            else
              (cd "$dir" && npm publish --tag rc --access public --provenance)
            fi
            npm dist-tag add "$name@$ver" latest
          done
