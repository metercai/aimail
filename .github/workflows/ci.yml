name: ci

# ═══════════════════════════════════════════════════════════════════════
# dev gate — owner 2026-10-11 cleanup (workflows 5 → 3; the release chain no longer uses a reusable workflow)
#
#   ci.yml            ← this file. dev gate: L0 for CLI and SDK + the "requires installed artifacts" L2 cases
#                       + native platform compile checks. Triggered by push/PR; also reused by publish.yml as the
#                       pre-release gate (workflow_call) ⇒ the gate is defined in exactly one place.
#   publish.yml       single release entry point (workflow_dispatch): gate → CLI build + GitHub Release
#                       → npm → PyPI (inlined) → L3. Replaces the old tag-triggered cli-release.yml +
#                       publish.yml + publish-pypi.yml trio and the workflow_run chain.
#   l3.yml            L3 matrix: nightly (schedule) + manual + invoked by publish.yml.
#
# External contract (the cloud side must match this repo): the sole publish file name publish.yml — npm's Trusted
# Publisher binds repo + workflow "publish.yml" + env "npm-release"; PyPI binds "publish.yml"
# + env "pypi-release". A rename must first update the npmjs/pypi-side bindings. Historical files cli.yml /
# cli-release.yml / l3-integration.yml are deleted; publish-pypi.yml was merged into publish.yml
# (PyPI does not accept a reusable workflow as a TP workflow, and the Build Config URI in the certificate records the
# top-level caller ⇒ the publish job must be inlined in publish.yml).
#
# Platform set (owner ruling Q2): unified to the **release set** = linux-musl amd64/arm64 + macos-arm64.
#   Windows: the CLI port is incomplete (bridge/repair depend on unix commands), no full chain is built — cli.yml previously
#   built windows and stayed red for a long time, one source of "red gate with no owner".
# ═══════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [main, master]
    paths:
      - "cli/**"
      - "pysdk/**"
      - "tssdk/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cli/**"
      - "pysdk/**"
      - "tssdk/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_call:   # publish.yml gate job reuses this file (single source; the gate is not maintained in two places)
    inputs:
      platforms:
        description: 'run the 3-platform compile check (publish.yml builds the same set itself)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cli-gates:
    name: cli-gates (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (dev battery — no SDK required)
        run: cargo test --all-targets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gate deps (pinned — same version as sdk-gates; for the registry-shape tests)
        run: python3 -m pip install --quiet pytest==9.1.1 PyYAML==6.0.2
      - name: Registry shape tests (pytest — data source = spec --json black-box)
        working-directory: .
        # P2c S3b: assertion semantics moved in from tests/sdk/; data source = target/debug/aimail already built by the previous cargo test
        # step, exported via `platform spec --json` (black-box, same source as the artifact under test).
        run: python3 -m pytest tests/cli/ -q
      - name: L2 battery — sdk-parity cases (need an installed agent-aimail)
        # This batch of cases drives the **installed** agent-aimail via the python gate ⇒ it is L2 (artifact level), so the dev battery turns it off
        # via the `sdk-parity` feature; here we explicitly install **the wheel built from this repo** (before the new PyPI name post-rename is
        # published, installing the official release 404s) into a venv and pin the interpreter with AIMAIL_PYTHON
        # (the head of sdkroot::probe_in_domain's chain = an explicit override wins).
        # NB: this job's default working-directory = cli (Cargo lives here), but pyproject.toml is at the **repo root**
        # ⇒ build must explicitly point at $GITHUB_WORKSPACE; cargo test keeps the job default (cli/).
        run: |
          python3 -m pip install --quiet build
          python3 -m build --wheel --outdir /tmp/sdk-wheel "$GITHUB_WORKSPACE"
          python3 -m venv /tmp/sdk-venv
          /tmp/sdk-venv/bin/pip install --quiet --disable-pip-version-check /tmp/sdk-wheel/agent_aimail-*.whl
          AIMAIL_PYTHON=/tmp/sdk-venv/bin/python cargo test --features sdk-parity --test repair_backfill_parity

  sdk-gates:
    name: "sdk-gates (L0: contract + pytest + tssdk)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tssdk/pnpm-lock.yaml
      - name: Install gate deps (pinned — gate deps pinned; upstream behavior changes must not silently change the verdict)
        run: python3 -m pip install --quiet pytest==9.1.1 pyflakes==3.4.0 PyYAML==6.0.2
      - name: pnpm install (tssdk workspace)
        working-directory: tssdk
        run: pnpm install --frozen-lockfile
      - name: L0 gate (contract single-source · zero-bridge · file-ownership · docs · pytest · tssdk build+vitest)
        run: bash tests/sdk/l0-gate-tests.sh

  platform-check:
    name: build ${{ matrix.name }}
    # always runs on push/PR; set to false when reused by publish.yml (its own cli-build is the same platform set).
    if: ${{ github.event_name != 'workflow_call' || inputs.platforms }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install deps (musl)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cargo build --release
        working-directory: cli
        env:
          # musl: explicit crt-static (otherwise you get a dynamically linked musl binary and the target machine lacks the loader).
          # NB: a single contains() check — the string `a || b && c || d` short-circuits at the first true value.
          RUSTFLAGS: ${{ contains(matrix.target, 'linux-musl') && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ contains(matrix.os, 'macos') && '11.0' || '' }}
        run: cargo build --release --target ${{ matrix.target }}
