[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimailsdk"
version = "0.1.3"
description = "AIMail runtime SDK (Python): gateway client, platform adapters, resources. Provisioning tools stay in the aimail repository."
# PyPI long description = the SDK-facing README (pysdk/README.md). The repo
# root README stays the repository homepage.
readme = "pysdk/README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "MeterCai" }]
keywords = ["aimail", "email", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The core runtime (aimail_base / aimail_tools / aimail_board /
# gateway_api / amail_mcp_server) is stdlib-only: every third-party import
# (yaml, markitdown) is lazy and host-gated. The only module-level
# third-party import in the package is fastapi, confined to the DeerFlow
# inbound router (deerflow extra, host always ships it). Keep the hard dep
# surface at zero so the package installs anywhere.
dependencies = []

[project.optional-dependencies]
# Document attachment -> markdown conversion (lazy import in core).
docs = ["markitdown>=0.0.1"]
# Hermes adapter profile-config parsing (lazy import; the Hermes host
# normally already ships PyYAML).
hermes = ["PyYAML>=6"]
# DeerFlow inbound router (aimail/deer-flow/aimail_inbound.py) imports fastapi
# at module level — loaded only inside the DeerFlow host, which already runs
# FastAPI; declared here for installability outside that host.
deerflow = ["fastapi>=0.100"]

[project.urls]
Homepage = "https://github.com/metercai/aimail"
Repository = "https://github.com/metercai/aimail"

# ── Wheel: single source of truth is the pysdk/ tree. Every file is
# force-included into the aimail/ package (hatchling has no rename for
# `packages`, so pysdk/ is never a package itself). Layout inside the
# package mirrors pysdk/ exactly — flat core + adapters + resources — so
# the runtime's sys.path bootstrap and the runtime_bundle resource
# resolution (root/resources/...) work identically for pip and repo.
[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"pysdk/__init__.py" = "aimail/__init__.py"
"pysdk/_aimail_bootstrap.py" = "aimail/_aimail_bootstrap.py"
"pysdk/aimail_base.py" = "aimail/aimail_base.py"
"pysdk/aimail_tools.py" = "aimail/aimail_tools.py"
"pysdk/aimail_board.py" = "aimail/aimail_board.py"
"pysdk/gateway_api.py" = "aimail/gateway_api.py"
"pysdk/amail_mcp_server.py" = "aimail/amail_mcp_server.py"
"pysdk/install.py" = "aimail/install.py"
"pysdk/_resources_release.py" = "aimail/_resources_release.py"
"pysdk/hermes/aimail_hermes.py" = "aimail/hermes/aimail_hermes.py"
"pysdk/hermes/patch_webhook.py" = "aimail/hermes/patch_webhook.py"
"pysdk/hermes/patch_profiles.py" = "aimail/hermes/patch_profiles.py"
"pysdk/hermes/ensure_config.py" = "aimail/hermes/ensure_config.py"
"pysdk/hermes/register_profiles.py" = "aimail/hermes/register_profiles.py"
"pysdk/hermes/toolsets.py" = "aimail/hermes/toolsets.py"
"pysdk/deer-flow/aimail_inbound.py" = "aimail/deer-flow/aimail_inbound.py"
"pysdk/deer-flow/amail_base.py" = "aimail/deer-flow/amail_base.py"
"pysdk/deer-flow/manage.py" = "aimail/deer-flow/manage.py"
# resources — released at install time to ~/.aimail/systems/{sid}/board/
# and read from there at runtime (user-personalizable); zh/soul variants are
# shipped for reference (default en).
"pysdk/resources/skills/SKILL.md" = "aimail/resources/skills/SKILL.md"
"pysdk/resources/skills/DESCRIPTION.md" = "aimail/resources/skills/DESCRIPTION.md"
"pysdk/resources/board/role_prompt_en/common.md" = "aimail/resources/board/role_prompt_en/common.md"
"pysdk/resources/board/role_prompt_en/orchestrator.md" = "aimail/resources/board/role_prompt_en/orchestrator.md"
"pysdk/resources/board/role_prompt_en/role_calibrator.md" = "aimail/resources/board/role_prompt_en/role_calibrator.md"
"pysdk/resources/board/role_prompt_en/verifier.md" = "aimail/resources/board/role_prompt_en/verifier.md"
"pysdk/resources/board/role_prompt_en/whoami.md" = "aimail/resources/board/role_prompt_en/whoami.md"
"pysdk/resources/board/role_prompt_en/worker.md" = "aimail/resources/board/role_prompt_en/worker.md"
"pysdk/resources/board/role_prompt_zh/common.md" = "aimail/resources/board/role_prompt_zh/common.md"
"pysdk/resources/board/role_prompt_zh/orchestrator.md" = "aimail/resources/board/role_prompt_zh/orchestrator.md"
"pysdk/resources/board/role_prompt_zh/role_calibrator.md" = "aimail/resources/board/role_prompt_zh/role_calibrator.md"
"pysdk/resources/board/role_prompt_zh/verifier.md" = "aimail/resources/board/role_prompt_zh/verifier.md"
"pysdk/resources/board/role_prompt_zh/whoami.md" = "aimail/resources/board/role_prompt_zh/whoami.md"
"pysdk/resources/board/role_prompt_zh/worker.md" = "aimail/resources/board/role_prompt_zh/worker.md"
"pysdk/resources/board/role_soul_en/Orchestrator.md" = "aimail/resources/board/role_soul_en/Orchestrator.md"
"pysdk/resources/board/role_soul_en/Owner.md" = "aimail/resources/board/role_soul_en/Owner.md"
"pysdk/resources/board/role_soul_en/Verifier.md" = "aimail/resources/board/role_soul_en/Verifier.md"
"pysdk/resources/board/role_soul_en/Worker.md" = "aimail/resources/board/role_soul_en/Worker.md"
"pysdk/resources/board/role_soul_zh/Orchestrator.md" = "aimail/resources/board/role_soul_zh/Orchestrator.md"
"pysdk/resources/board/role_soul_zh/Owner.md" = "aimail/resources/board/role_soul_zh/Owner.md"
"pysdk/resources/board/role_soul_zh/Verifier.md" = "aimail/resources/board/role_soul_zh/Verifier.md"
"pysdk/resources/board/role_soul_zh/Worker.md" = "aimail/resources/board/role_soul_zh/Worker.md"

# ── sdist: everything needed to build a wheel from a clean checkout.
[tool.hatch.build.targets.sdist]
include = [
    "pysdk",
    "cli",
    "bridge",
    "docs",
    "README.md",
    "README_zh.md",
    "COPYING",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc"]
