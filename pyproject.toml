[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-aimail"
version = "0.2.2"
description = "AIMail runtime SDK (Python): gateway client, platform adapters, resources. Provisioning tools stay in the aimail repository."
# PyPI long description = the SDK-facing README (pysdk/README.md). The repo
# root README stays the repository homepage.
readme = "pysdk/README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "MeterCai" }]
keywords = ["aimail", "email", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Runtime dependency note (2026-10-11, C-13): the hermes adapter must read AND
# write the host's config.yaml (platforms.webhook + platform_toolsets) on the
# install/register path, so a YAML parser has to exist in the interpreter the
# SDK actually runs in. The official uv-managed host ships a bare CPython —
# it carries its own ruamel-yaml but NO PyYAML — and the CLI installs the SDK
# with `pip install agent-aimail` (no extras). PyYAML is therefore a hard dep
# (cp314 wheels exist for every release platform). The remaining third-party
# imports stay optional and host-gated: markitdown (docs extra) degrades to
# keeping the original attachment, fastapi (deerflow extra) is a module-level
# import of the DeerFlow adapter, which runs inside the DeerFlow host.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
# Document attachment -> markdown conversion (lazy import in core). NOTE: no
# install face selects this extra today, so the current deployments never get
# markitdown — the conversion silently does not happen (core keeps the original
# file and the agent falls through to its PDF skill).
docs = ["markitdown>=0.0.1"]
# Kept for installs that select the extra explicitly; PyYAML is now also a hard
# dependency (see the note above), because the host cannot be relied on for it.
hermes = ["PyYAML>=6"]
# DeerFlow inbound router (aimail/deer-flow/aimail_inbound.py) imports fastapi
# at module level — loaded only inside the DeerFlow host, which already runs
# FastAPI; declared here for installability outside that host.
deerflow = ["fastapi>=0.100"]

[project.urls]
Homepage = "https://github.com/metercai/aimail"
Repository = "https://github.com/metercai/aimail"

# ── Wheel: single source of truth is the pysdk/ tree. Every file is
# force-included into the aimail/ package (hatchling has no rename for
# `packages`, so pysdk/ is never a package itself). Layout inside the
# package mirrors pysdk/ exactly — flat core + adapters + resources — so
# the runtime's sys.path bootstrap and the runtime_bundle resource
# resolution (root/resources/...) work identically for pip and repo.
[project.scripts]
aimail-agent = "aimail.aimail_agent:main"
# Minimal bootstrap surface (activate / pull) for hosts without a toolset. Hosts with a toolset use the tools, not this.

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"pysdk/__init__.py" = "aimail/__init__.py"
"pysdk/_aimail_bootstrap.py" = "aimail/_aimail_bootstrap.py"
"pysdk/aimail_base.py" = "aimail/aimail_base.py"
"pysdk/aimail_tools.py" = "aimail/aimail_tools.py"
"pysdk/aimail_board.py" = "aimail/aimail_board.py"
# Agent-side contract constants (inbound path / ports / skill name) — both the adapter layer and the session tools import it bare.
"pysdk/aimail_contract.py" = "aimail/aimail_contract.py"
"pysdk/gateway_api.py" = "aimail/gateway_api.py"
"pysdk/aimail_mcp_server.py" = "aimail/aimail_mcp_server.py"
# Agent-level runtime (scenario 1): toolset + skill install + pull startup; generic hosts call it directly.
"pysdk/aimail_agent.py" = "aimail/aimail_agent.py"
"pysdk/install.py" = "aimail/install.py"
# SDK-side executable gate (process-command contract) — same class as install.py: spawnable by a caller in any language;
# the result is a single line of JSON. The TS counterpart = the register-cli.js shipped with the platform package.
"pysdk/sdk_ops.py" = "aimail/sdk_ops.py"
"pysdk/_resources_release.py" = "aimail/_resources_release.py"
# hosts identification layer (ported from the tssdk trio) — registry / detection / activation, single source for hosts.
"pysdk/hosts/__init__.py" = "aimail/hosts/__init__.py"
"pysdk/hosts/registry.py" = "aimail/hosts/registry.py"
"pysdk/hosts/detect.py" = "aimail/hosts/detect.py"
"pysdk/hosts/activate.py" = "aimail/hosts/activate.py"
"pysdk/hermes/aimail_hermes.py" = "aimail/hermes/aimail_hermes.py"
"pysdk/hermes/patch_webhook.py" = "aimail/hermes/patch_webhook.py"
"pysdk/hermes/patch_profiles.py" = "aimail/hermes/patch_profiles.py"
"pysdk/hermes/ensure_config.py" = "aimail/hermes/ensure_config.py"
"pysdk/hermes/register_profiles.py" = "aimail/hermes/register_profiles.py"
"pysdk/hermes/toolsets.py" = "aimail/hermes/toolsets.py"
"pysdk/deer-flow/aimail_inbound.py" = "aimail/deer-flow/aimail_inbound.py"
"pysdk/deer-flow/aimail_deerflow.py" = "aimail/deer-flow/aimail_deerflow.py"
"pysdk/deer-flow/manage.py" = "aimail/deer-flow/manage.py"
# Audit D4: the CLI platform install step calls these two scripts as {sdk}/deer-flow/install-*.sh; shipped with source only
# means the pip layout can't find them (warn + degrade only) ⇒ also bundle them into the wheel (verify-wheel asserts this).
"pysdk/deer-flow/install-mcp.sh" = "aimail/deer-flow/install-mcp.sh"
"pysdk/deer-flow/install-skill.sh" = "aimail/deer-flow/install-skill.sh"
# resources — released at install time to ~/.aimail/systems/{sid}/board/
# and read from there at runtime (user-personalizable); zh/soul variants are
# shipped for reference (default en).
# Single source for resources = the repo-root resources/ (git-tracked, the only editable place); the copy inside each adapter package
# is a generated artifact **staged by that package's own prepack** (gitignored). pysdk keeps no copy: in a repo checkout
# the SDK reads the repo-root resources/ directly (see pysdk/_resources_release.resources_root).
# One directory-level line suffices: the in-wheel layout aimail/resources/... is identical to the old per-file enumeration.
"resources" = "aimail/resources"

# ── sdist: everything needed to build a wheel from a clean checkout.
[tool.hatch.build.targets.sdist]
include = [
    "pysdk",
    "cli",
    "bridge",
    "docs",
    "README.md",
    "README_zh.md",
    "COPYING",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc"]
