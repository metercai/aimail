[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-aimail"
version = "0.4.1"
description = "AIMail runtime SDK (Python): gateway client, platform adapters, resources. Provisioning tools stay in the aimail repository."
# PyPI long description = the SDK-facing README (pysdk/README.md). The repo
# root README stays the repository homepage.
readme = "pysdk/README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "MeterCai" }]
keywords = ["aimail", "email", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Runtime dependency note (revised 2026-11-25, v1 hermes retirement): PyYAML used to be a hard
# dependency because the v1 hermes adapter parsed and rewrote the host's config.yaml on the
# install/register path. That adapter is gone (pysdk/hermes/), and the v2 hermes plugin talks to the
# host through the `hermes_agent.plugins` entry point instead of editing YAML, so no shipped module
# imports yaml any more. The remaining third-party imports stay optional and host-gated: markitdown
# (docs extra) degrades to keeping the original attachment; the v1 deer-flow adapter (which needed
# fastapi) was retired on 2026-11-25 together with the CLI installer.
dependencies = []

[project.optional-dependencies]
# Document attachment -> markdown conversion (lazy import in core). NOTE: no
# install face selects this extra today, so the current deployments never get
# markitdown — the conversion silently does not happen (core keeps the original
# file and the agent falls through to its PDF skill).
docs = ["markitdown>=0.0.1"]
# v2 hermes plugin: no third-party runtime deps (it talks to the host through the plugin API).
hermes = []
# v2 deerflow extension (deerflow_plugin) needs no third-party runtime: it uses the host's own API.
deerflow = []

[project.urls]
Homepage = "https://github.com/metercai/aimail"
Repository = "https://github.com/metercai/aimail"

# ── Wheel: single source of truth is the pysdk/ tree. Every file is
# force-included into the aimail/ package (hatchling has no rename for
# `packages`, so pysdk/ is never a package itself). Layout inside the
# package mirrors pysdk/ exactly — flat core + adapters + resources — so
# the runtime's sys.path bootstrap and the runtime_bundle resource
# resolution (root/resources/...) work identically for pip and repo.
[project.scripts]
aimail-agent = "aimail.aimail_agent:main"
# Minimal bootstrap surface (activate / pull) for hosts without a toolset. Hosts with a
# toolset use the tools, not this.

# Hermes plugin entry point: the host loads plugins from this group and calls register(ctx).
# Declared here (not in host config) so `pip install` IS the install — no CLI, no patch.
[project.entry-points."hermes_agent.plugins"]
aimail = "aimail.hermes_plugin:register"
# DeerFlow extension entry point: the host loads extensions from this group
# (`deerflow.extensions`) and calls install(registry, config).
[project.entry-points."deerflow.extensions"]
aimail = "aimail.deerflow_plugin:install"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"pysdk/__init__.py" = "aimail/__init__.py"
"pysdk/_aimail_bootstrap.py" = "aimail/_aimail_bootstrap.py"
"pysdk/aimail_base.py" = "aimail/aimail_base.py"
"pysdk/aimail_tools.py" = "aimail/aimail_tools.py"
"pysdk/aimail_board.py" = "aimail/aimail_board.py"
# SSOT (2026-11-03): the shared 15-tool spec (JSON) + its zero-side-effect
# projection module. Every registration surface (MCP TOOLS, hermes schemas)
# reads through tool_spec.SPEC_PATH, so both must ship in the wheel.
"pysdk/tool-spec.json" = "aimail/tool-spec.json"
"pysdk/tool_spec.py" = "aimail/tool_spec.py"
# Agent-side contract constants (inbound path / ports / skill name) — both the adapter layer and the session tools import it bare.
"pysdk/aimail_contract.py" = "aimail/aimail_contract.py"
"pysdk/gateway_api.py" = "aimail/gateway_api.py"
"pysdk/aimail_mcp_server.py" = "aimail/aimail_mcp_server.py"
# Agent-level runtime (scenario 1): toolset + skill install + pull startup; generic hosts call it directly.
"pysdk/aimail_agent.py" = "aimail/aimail_agent.py"
# SDK-side executable gate (process-command contract) — same class as install.py: spawnable by a caller in any language;
# the result is a single line of JSON. The TS counterpart = the register-cli.js shipped with the platform package.
"pysdk/_resources_release.py" = "aimail/_resources_release.py"
# hosts identification layer (ported from the tssdk trio) — registry / detection / activation, single source for hosts.
# V2 shared core (SSE aggregation, AgentSystemId, grouping, skip/ack). Both pysdk host
# adapters import this layer, so it must ship in the wheel beside the flat core modules
# its bootstrap puts on sys.path.
"pysdk/v2/__init__.py" = "aimail/v2/__init__.py"
"pysdk/v2/agent_system_id.py" = "aimail/v2/agent_system_id.py"
"pysdk/v2/binding.py" = "aimail/v2/binding.py"
"pysdk/v2/anchor.py" = "aimail/v2/anchor.py"
"pysdk/v2/thread.py" = "aimail/v2/thread.py"
# Hermes plugin (SSE-V2): platform adapter + runtime + tool registration + manifest.
# The wheel is the whole install story — a pip install makes the host discover it via the
# ``hermes_agent.plugins`` entry point below (no CLI, no source patch).
"pysdk/hermes_plugin/__init__.py" = "aimail/hermes_plugin/__init__.py"
"pysdk/hermes_plugin/plugin.yaml" = "aimail/hermes_plugin/plugin.yaml"
"pysdk/hermes_plugin/adapter.py" = "aimail/hermes_plugin/adapter.py"
"pysdk/hermes_plugin/runtime.py" = "aimail/hermes_plugin/runtime.py"
"pysdk/hermes_plugin/identity.py" = "aimail/hermes_plugin/identity.py"
"pysdk/hermes_plugin/tools.py" = "aimail/hermes_plugin/tools.py"
# DeerFlow extension (SSE-V2): tools via PluginContribution + one aggregate stream per
# (AgentSystemId, Gateway). `deerflow.extensions` is the host's own discovery group, so a
# pip install is the whole installation.
"pysdk/deerflow_plugin/__init__.py" = "aimail/deerflow_plugin/__init__.py"
"pysdk/deerflow_plugin/tools.py" = "aimail/deerflow_plugin/tools.py"
"pysdk/deerflow_plugin/runtime.py" = "aimail/deerflow_plugin/runtime.py"
"pysdk/deerflow_plugin/identity.py" = "aimail/deerflow_plugin/identity.py"
"pysdk/v2/pull_client.py" = "aimail/v2/pull_client.py"
"pysdk/v2/system_pull.py" = "aimail/v2/system_pull.py"
"pysdk/v2/outbound.py" = "aimail/v2/outbound.py"
# v1 hermes adapter retired 2026-11-25 (owner go-ahead): no `aimail/hermes/` in the wheel, so no
# `aimail.hermes.aimail_hermes` import path exists any more. The v2 surface is `hermes_plugin`
# (above) + the `hermes_agent.plugins` entry point.
# Legacy source-patch era (0.2.x) — NOT shipped in 0.3.0 (§6.8 of the V2 plan). The files
# stay in the tree for history and for the "explicit switch only" audit, but the published
# package must carry no webhook patcher, no toolsets patcher and no profile registrar:
# installation is a pip install + the host's own plugin mechanism, nothing else.
# Audit D4: the CLI platform install step calls these two scripts as {sdk}/deer-flow/install-*.sh; shipped with source only
# means the pip layout can't find them (warn + degrade only) ⇒ also bundle them into the wheel (verify-wheel asserts this).
# resources — released at install time to ~/.aimail/systems/{sid}/board/
# and read from there at runtime (user-personalizable); zh/soul variants are
# shipped for reference (default en).
# Single source for resources = the repo-root resources/ (git-tracked, the only editable place); the copy inside each adapter package
# is a generated artifact **staged by that package's own prepack** (gitignored). pysdk keeps no copy: in a repo checkout
# the SDK reads the repo-root resources/ directly (see pysdk/_resources_release.resources_root).
# One directory-level line suffices: the in-wheel layout aimail/resources/... is identical to the old per-file enumeration.
"resources" = "aimail/resources"

# ── sdist: everything needed to build a wheel from a clean checkout.
[tool.hatch.build.targets.sdist]
include = [
    "pysdk",
    "cli",
    "bridge",
    "docs",
    "README.md",
    "README_zh.md",
    "COPYING",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc"]
