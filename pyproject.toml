[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimail"
version = "0.1.0"
description = "AgentMail runtime SDK (Python): gateway client, platform adapters, resources. Provisioning tools stay in the agentmail repository."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "MeterCai" }]
keywords = ["agentmail", "email", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The core runtime (aimail_base / aimail_tools / aimail_board /
# gateway_api / amail_mcp_server) is stdlib-only: every third-party import
# (yaml, markitdown) is lazy and host-gated. Keep the hard dep surface at
# zero so the package installs anywhere.
dependencies = []

[project.optional-dependencies]
# Document attachment -> markdown conversion (lazy import in core).
docs = ["markitdown>=0.0.1"]
# Hermes adapter profile-config parsing (lazy import; the Hermes host
# normally already ships PyYAML).
hermes = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/metercai/aimail"
Repository = "https://github.com/metercai/aimail"

# ── Wheel: glue code from src/aimail + runtime files force-included from
# their single source of truth (tools/, scripts/). Flat layout inside the
# package mirrors tools/ so the runtime's sys.path bootstrap works as-is.
[tool.hatch.build.targets.wheel]
packages = ["src/aimail"]

[tool.hatch.build.targets.wheel.force-include]
"tools/_aimail_bootstrap.py" = "aimail/_aimail_bootstrap.py"
"tools/aimail_base.py" = "aimail/aimail_base.py"
"tools/aimail_tools.py" = "aimail/aimail_tools.py"
"tools/aimail_board.py" = "aimail/aimail_board.py"
"tools/amail_mcp_server.py" = "aimail/amail_mcp_server.py"
"tools/hermes/aimail_hermes.py" = "aimail/hermes/aimail_hermes.py"
"tools/openclaw/amail.py" = "aimail/openclaw/amail.py"
"tools/openclaw/amail_base.py" = "aimail/openclaw/amail_base.py"
"tools/openclaw/amail_openclaw_bridge.py" = "aimail/openclaw/amail_openclaw_bridge.py"
"tools/deer-flow/aimail_inbound.py" = "aimail/deer-flow/aimail_inbound.py"
"tools/deer-flow/amail_base.py" = "aimail/deer-flow/amail_base.py"
"tools/gateway_api.py" = "aimail/gateway_api.py"
"skills/SKILL.md" = "aimail/skills/SKILL.md"
"skills/DESCRIPTION.md" = "aimail/skills/DESCRIPTION.md"
"board/role_prompt_en/common.md" = "aimail/board_role_prompt_en/common.md"
"board/role_prompt_en/orchestrator.md" = "aimail/board_role_prompt_en/orchestrator.md"
"board/role_prompt_en/verifier.md" = "aimail/board_role_prompt_en/verifier.md"
"board/role_prompt_en/whoami.md" = "aimail/board_role_prompt_en/whoami.md"
"board/role_prompt_en/worker.md" = "aimail/board_role_prompt_en/worker.md"

# ── sdist: everything needed to build a wheel from a clean checkout.
[tool.hatch.build.targets.sdist]
include = [
    "src/aimail",
    "tools",
    "skills",
    "board/role_prompt_en",
    "scripts/setup_system.py",
    "scripts/deploy_bridge.py",
    "README.md",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc"]
